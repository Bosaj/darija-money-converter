<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>شحال؟ · Darija Money Converter</title>
    <meta name="description" content="Convert Moroccan money slang — rial, santim/franc, million, doro — to Dirham and back. Type or say it in Darija. Works offline." />
    <meta name="theme-color" content="#f6f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="شحال؟ — Darija Money Converter" />
    <meta property="og:description" content="عشرين ألف ريال؟ جوج د المليون؟ Convert Moroccan money slang to Dirham instantly." />
    <meta property="og:type" content="website" />
    <script>
      try {
        var t = localStorage.getItem('dmc:theme')
        if (t) document.documentElement.dataset.theme = JSON.parse(t)
        // same rule as initialLang() in App.tsx, applied before the first paint so the page never flips direction
        var l = JSON.parse(localStorage.getItem('dmc:lang') || 'null')
        if (!l) { var n = (navigator.language || '').toLowerCase(); l = n.indexOf('fr') === 0 ? 'fr' : n.indexOf('en') === 0 ? 'en' : 'ar' }
        document.documentElement.lang = l
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
